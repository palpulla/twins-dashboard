<!doctype html>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; font-family:'Inter',sans-serif; background:#152647; position:relative; }
  .photo { position:absolute; top:0; left:0; width:1080px; height:1010px; overflow:hidden; }
  .photo img.job { width:100%; height:100%; object-fit:cover; object-position:center 20%; position:relative; z-index:1; }
  /* fit-contain mode (before/after collages): full image letterboxed over a blurred backdrop */
  .photo.contain img.job { object-fit:contain; object-position:center center; }
  .photo img.backdrop { display:none; }
  .photo.contain img.backdrop { display:block; position:absolute; inset:-40px; width:1160px; height:1090px;
    object-fit:cover; filter:blur(42px) brightness(.72); z-index:0; }
  .photo::after { content:''; position:absolute; inset:0; z-index:2;
    background:linear-gradient(180deg, rgba(21,38,71,0) 65%, rgba(21,38,71,.6) 100%); }
  .shield { position:absolute; top:36px; left:36px; width:260px; z-index:3;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.45)); }
  .mascots { position:absolute; right:36px; bottom:325px; width:330px; z-index:3;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.45)); }
  .band { position:absolute; left:0; bottom:0; width:1080px; height:340px; background:#152647;
    padding:40px 56px 0; z-index:2; }
  .band::before { content:''; position:absolute; top:0; left:0; width:1080px; height:10px;
    background:linear-gradient(90deg,#F5B301,#FFD34D); }
  .kicker { font:700 30px 'Inter'; letter-spacing:6px; color:#7f93bd; text-transform:uppercase; }
  .headline { font:400 74px 'Lilita One'; color:#F5B301; letter-spacing:1px; margin-top:8px;
    text-transform:uppercase; max-width:660px; line-height:1.05; text-shadow:0 4px 0 rgba(0,0,0,.25); }
  .footer { position:absolute; bottom:30px; left:56px; }
  .footer .site { font:700 34px 'Inter'; color:#fff; }
  .footer .area { font:500 27px 'Inter'; color:#9fb0d4; margin-top:6px; }
  .qr { position:absolute; right:56px; bottom:26px; z-index:4; width:180px; text-align:center; }
  .qr .box { background:#fff; border-radius:16px; padding:9px; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  .qr img { width:100%; display:block; }
  .qr .label { font:700 21px 'Inter'; color:#F5B301; letter-spacing:2px; margin-top:8px; }
</style>
<div class="photo {{FIT}}"><img class="backdrop" src="{{PHOTO}}"><img class="job" src="{{PHOTO}}"></div>
<img class="shield" src="{{BRAND}}/logo_text.png">
<img class="mascots" src="{{BRAND}}/mascots.png">
<div class="band">
  <div class="kicker">{{KICKER}}</div>
  <div class="headline">{{HEADLINE}}</div>
  <div class="footer">
    <div class="site">twinsgaragedoors.com</div>
    <div class="area">Madison &amp; Dane County, WI</div>
  </div>
</div>
<div class="qr">
  <div class="box"><img src="{{BRAND}}/booking_qr.png"></div>
  <div class="label">SCAN TO BOOK</div>
</div>
